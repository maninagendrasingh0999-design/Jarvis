name: Jarvis Ultimate ElevenLabs & Background Fix

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 Directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Web UI & Patch API Keys Directly in Source
        env:
          GEMINI_API_KEY: "AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkxKaTI"
          ELEVENLABS_API_KEY: "sk_c36888ff1de346c84f4a7b18d1051d849382a594d69812e6"
          VITE_GEMINI_API_KEY: "AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkxKaTI"
          VITE_ELEVENLABS_API_KEY: "sk_c36888ff1de346c84f4a7b18d1051d849382a594d69812e6"
        run: |
          mkdir -p /tmp/web_extract app/src/main/assets app/src/main/java/com/myassistant/app
          
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o -q "$z" -d /tmp/web_extract/
            fi
          done

          if [ -z "$(ls -A /tmp/web_extract)" ]; then
            cp -r * /tmp/web_extract/ 2>/dev/null || true
          fi

          PKG_FILE=$(find /tmp/web_extract -name "package.json" | head -n 1)
          if [ -n "$PKG_FILE" ]; then
            WEB_DIR=$(dirname "$PKG_FILE")
            cd "$WEB_DIR"
            cat << 'ENVEOF' > .env
          GEMINI_API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkxKaTI
          ELEVENLABS_API_KEY=sk_c36888ff1de346c84f4a7b18d1051d849382a594d69812e6
          VITE_GEMINI_API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkxKaTI
          VITE_ELEVENLABS_API_KEY=sk_c36888ff1de346c84f4a7b18d1051d849382a594d69812e6
          ENVEOF
            cp .env .env.production
            cp .env .env.local
            npm install --legacy-peer-deps || true
            npm run build || true
            cd -
            if [ -d "$WEB_DIR/dist" ]; then
              cp -r "$WEB_DIR/dist/"* app/src/main/assets/
            elif [ -d "$WEB_DIR/build" ]; then
              cp -r "$WEB_DIR/build/"* app/src/main/assets/
            else
              cp -r "$WEB_DIR/"* app/src/main/assets/
            fi
          else
            FOUND_HTML=$(find /tmp/web_extract -name "index.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              HTML_DIR=$(dirname "$FOUND_HTML")
              cp -r "$HTML_DIR/"* app/src/main/assets/
            fi
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.myassistant.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.myassistant.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 70
                  versionName "70.0"
                  buildConfigField "String", "GEMINI_API_KEY", "\"AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkxKaTI\""
                  buildConfigField "String", "ELEVENLABS_API_KEY", "\"sk_c36888ff1de346c84f4a7b18d1051d849382a594d69812e6\""
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
                    cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
