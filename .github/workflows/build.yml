name: Ultimate React Build Fixer

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java 17 & Gradle 8.7
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Unzip, Build Vite App & Copy to Assets
        run: |
          mkdir -p extracted_web
          if [ -f "web-source.zip" ]; then
            unzip -o "web-source.zip" -d extracted_web/
          else
            for z in *.zip; do
              if [ -f "$z" ]; then
                unzip -o "$z" -d extracted_web/
              fi
            done
          fi

          mkdir -p app/src/main/java/com/myassistant/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # Find where package.json is located
          PKG_FILE=$(find extracted_web -maxdepth 4 -name "package.json" | head -n 1)

          if [ -n "$PKG_FILE" ]; then
            WEB_DIR=$(dirname "$PKG_FILE")
            echo "Building React project in $WEB_DIR..."
            pushd "$WEB_DIR"
            
            # Inject API Key
            echo "GEMINI_API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI" > .env
            echo "VITE_GEMINI_API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI" >> .env
            
            npm install --legacy-peer-deps || npm install
            npx vite build --base=./ || npm run build || true
            popd

            if [ -d "$WEB_DIR/dist" ]; then
              cp -r "$WEB_DIR/dist/"* app/src/main/assets/
              echo "Copied from dist successfully!"
            elif [ -d "$WEB_DIR/build" ]; then
              cp -r "$WEB_DIR/build/"* app/src/main/assets/
              echo "Copied from build successfully!"
            else
              cp -r "$WEB_DIR/"* app/src/main/assets/ 2>/dev/null || true
            fi
          else
            cp -r extracted_web/* app/src/main/assets/ 2>/dev/null || true
          fi

          # Safety check: if index.html is nested, bring it to root of assets
          if [ ! -f "app/src/main/assets/index.html" ]; then
            FOUND_HTML=$(find app/src/main/assets -name "index.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              PARENT_DIR=$(dirname "$FOUND_HTML")
              if [ "$PARENT_DIR" != "app/src/main/assets" ]; then
                cp -r "$PARENT_DIR/"* app/src/main/assets/
              fi
            fi
          fi

          # Android configuration files
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.myassistant.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.myassistant.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="J.A.R.V.I.S. AI"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/myassistant/app/MainActivity.kt
          package com.myassistant.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.CALL_PHONE
                  )
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), 100)

                  webView = WebView(this)
                  setContentView(webView)

                  val s = webView.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.databaseEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.allowFileAccess = true
                  s.allowContentAccess = true
                  s.allowFileAccessFromFileURLs = true
                  s.allowUniversalAccessFromFileURLs = true

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val url = request.url.toString()
                          if (url.startsWith("tel:") || url.startsWith("whatsapp:") || url.startsWith("intent:") || url.contains("youtube.com")) {
                              try {
                                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              }
                              return true
                          }
                          return false
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread { request.grant(request.resources) }
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF

          gradle assembleDebug --no-daemon

      - name: 6. Upload Working APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Working-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
