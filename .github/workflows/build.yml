name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        working-directory: .
        run: |
          unzip -q web-source.zip -d _src
          P=$(find _src -name package.json -not -path '*/node_modules/*' | head -1)
          echo "package.json mila: $P"
          mv "$(dirname "$P")" app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Capacitor + plugins
        run: |
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --legacy-peer-deps @capacitor-community/speech-recognition @capacitor/local-notifications@7

      - name: Build web app
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Capacitor init (if needed)
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init Jarvis com.jarvis.assistant --web-dir=dist
          fi

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Add mic permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO $M; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' $M
          fi

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
