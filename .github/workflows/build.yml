                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:keepScreenOn="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingControlService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".JarvisNotificationListener"
                      android:label="Jarvis Message Reader"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
                    cat << 'EOF' > app/src/main/java/com/myassistant/app/JarvisNotificationListener.kt
          package com.myassistant.app

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.app.Notification

          class JarvisNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn == null) return
                  val pkg = sbn.packageName ?: ""
                  if (pkg.contains("whatsapp") || pkg.contains("sms") || pkg.contains("mms") || pkg.contains("messaging") || pkg.contains("telegram") || pkg.contains("instagram")) {
                      val extras = sbn.notification.extras
                      val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: "Kisi"
                      val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      if (text.isNotEmpty() && !title.contains("WhatsApp", ignoreCase = true)) {
                          val msg = "Sir, $title ka message aaya hai: $text. Bataiye kya karna hai?"
                          FloatingControlService.instance?.speak(msg)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/myassistant/app/FloatingControlService.kt
          package com.myassistant.app

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.AlarmClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telecom.TelecomManager
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class FloatingControlService : Service(), TextToSpeech.OnInitListener {
              companion object {
                  var instance: FloatingControlService? = null
                  var isAppInForeground: Boolean = true
                  var awakeUntilTimestamp: Long = 0L
              }
              private var windowManager: WindowManager? = null
              private var floatingView: View? = null
              private var statusBadge: TextView? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var tts: TextToSpeech? = null
              private var bgRecognizer: SpeechRecognizer? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isTtsSpeaking = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  tts = TextToSpeech(this, this)
                  acquireWakeLock()
                  startForegroundNotification()
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {
                      showFloatingButton()
                  }
                  awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                  startBackgroundVoiceLoop()
              }

              private fun acquireWakeLock() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Jarvis::HandsFreeWakeLock")
                      wakeLock?.acquire()
                  } catch (e: Exception) { e.printStackTrace() }
              }
                            private fun startForegroundNotification() {
                  val channelId = "jarvis_handsfree_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "JARVIS Hands-Free Guard", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(channel)
                  }
                  val returnIntent = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  }
                  val pendingIntent = PendingIntent.getActivity(this, 0, returnIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("J.A.R.V.I.S. 100% Hands-Free Active")
                      .setContentText("Just say 'Jarvis' anytime from any screen")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
                  startForeground(101, notification)
              }

              private fun showFloatingButton() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val density = resources.displayMetrics.density
                  val width = (105 * density).toInt()
                  val height = (42 * density).toInt()

                  val container = FrameLayout(this)
                  val bg = GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = 50f
                      setColor(Color.parseColor("#EE03152D"))
                      setStroke(4, Color.parseColor("#00F3FF"))
                  }
                  container.background = bg

                  statusBadge = TextView(this).apply {
                      text = "🟢 JARVIS ON"
                      setTextColor(Color.parseColor("#00F3FF"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                  }
                  container.addView(statusBadge, FrameLayout.LayoutParams(width, height))

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      width, height, layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 14
                      y = 260
                  }

                  var initX = 0
                  var initY = 0
                  var touchX = 0f
                  var touchY = 0f

                  container.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initX = params.x
                              initY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initX - (event.rawX - touchX).toInt()
                              params.y = initY + (event.rawY - touchY).toInt()
                              windowManager?.updateViewLayout(container, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (Math.abs(event.rawX - touchX) < 15 && Math.abs(event.rawY - touchY) < 15) {
                                  awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                                  updateBadgeVisual(true)
                                  bringJarvisToFront("Ji boliye Sir, main sun raha hoon.")
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  floatingView = container
                  windowManager?.addView(floatingView, params)
              }

              private fun updateBadgeVisual(awake: Boolean) {
                  handler.post {
                      statusBadge?.text = if (awake) "🟢 JARVIS ON" else "💤 SAY JARVIS"
                      statusBadge?.setTextColor(if (awake) Color.parseColor("#00FFAA") else Color.parseColor("#00F3FF"))
                  }
              }

              private fun startBackgroundVoiceLoop() {
                  handler.post {
                      try {
                          if (bgRecognizer == null && SpeechRecognizer.isRecognitionAvailable(this)) {
                              bgRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                              bgRecognizer?.setRecognitionListener(object : RecognitionListener {
                                  override fun onReadyForSpeech(params: Bundle?) {}
                                  override fun onBeginningOfSpeech() {}
                                  override fun onRmsChanged(rmsdB: Float) {}
                                  override fun onBufferReceived(buffer: ByteArray?) {}
                                  override fun onEndOfSpeech() {}
                                  override fun onError(error: Int) { scheduleRestartListening(700) }
                                  override fun onResults(results: Bundle?) {
                                      val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                      if (!matches.isNullOrEmpty()) { handleSpokenCommand(matches[0]) }
                                      scheduleRestartListening(400)
                                  }
                                  override fun onPartialResults(partialResults: Bundle?) {}
                                  override fun onEvent(eventType: Int, params: Bundle?) {}
                              })
                          }
                          scheduleRestartListening(500)
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
                            private fun scheduleRestartListening(delayMs: Long) {
                  handler.postDelayed({
                      val isAwake = System.currentTimeMillis() < awakeUntilTimestamp
                      updateBadgeVisual(isAwake)
                      if (!isTtsSpeaking) {
                          try {
                              val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                                  putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                              }
                              bgRecognizer?.startListening(intent)
                          } catch (e: Exception) { e.printStackTrace() }
                      } else {
                          scheduleRestartListening(1200)
                      }
                  }, delayMs)
              }

              fun handleSpokenCommand(rawText: String): Boolean {
                  val cmd = rawText.trim()
                  val low = cmd.lowercase(Locale.getDefault())
                  val hasWakeWord = low.contains("jarvis") || low.contains("जार्विस") || low.contains("जर्विस") || low.contains("जरविस") || low.contains("javis")
                  val isAwake = System.currentTimeMillis() < awakeUntilTimestamp

                  if (!hasWakeWord && !isAwake) return false

                  awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                  updateBadgeVisual(true)

                  val cleanCmd = low.replace(Regex("hey|hi|hello|सुनो|अरे|भाई|यार|jarvis|जार्विस|जर्विस|जरविस|javis"), "").trim()
                  if (hasWakeWord && cleanCmd.length < 2) {
                      speak("Ji boliye Sir!")
                      return true
                  }

                  if (low.contains("band kar") || low.contains("बंद कर") || low.contains("kat de") || low.contains("काट दे") || low.contains("wapas") || low.contains("वापस") || low.contains("close app") || low.contains("stop youtube") || low.contains("dusra kaam") || low.contains("दूसरा काम")) {
                      if (low.contains("call") || low.contains("phone") || low.contains("कॉल") || low.contains("फोन")) {
                          endPhoneCall()
                          return true
                      }
                      bringJarvisToFront("Theek hai Sir, maine use band kar diya hai. Bataiye ab agla kya kaam karna hai?")
                      return true
                  }

                  if ((low.contains("call") || low.contains("phone") || low.contains("कॉल") || low.contains("फोन")) &&
                      (low.contains("utha") || low.contains("उठा") || low.contains("pick") || low.contains("answer") || low.contains("receive"))) {
                      answerPhoneCall()
                      return true
                  }

                  if ((low.contains("call") || low.contains("phone") || low.contains("कॉल") || low.contains("फोन")) &&
                      (low.contains("kat") || low.contains("काट") || low.contains("cut") || low.contains("end") || low.contains("disconnect") || low.contains("band") || low.contains("बंद"))) {
                      endPhoneCall()
                      return true
                  }

                  val digits = cmd.replace(Regex("\\D"), "")
                  if ((low.contains("call") || low.contains("phone") || low.contains("कॉल") || low.contains("फोन") || low.contains("dial")) && digits.length >= 10) {
                      makeDirectCall(digits)
                      return true
                  }

                  if (low.contains("download") || low.contains("install") || low.contains("डाउनलोड") || low.contains("इंस्टॉल")) {
                      val appName = cleanCmd.replace(Regex("app|application|ko|kar|de|do|karo|play store|se|download|install|डाउनलोड|इंस्टॉल|कर|दे|दो"), "").trim()
                      downloadAppFromPlayStore(appName.ifEmpty { cleanCmd })
                      return true
                  }

                  if (low.contains("torch") || low.contains("flashlight") || low.contains("light") || low.contains("टॉर्च") || low.contains("लाइट")) {
                      val turnOn = !(low.contains("off") || low.contains("band") || low.contains("बंद") || low.contains("bujha"))
                      toggleTorch(turnOn)
                      speak(if (turnOn) "Theek hai Sir, kar raha hoon, flashlight on kar di hai." else "Theek hai Sir, flashlight band kar di hai.")
                      return true
                  }

                  if (low.contains("khol") || low.contains("खोल") || low.contains("open") || low.contains("chala") || low.contains("चला")) {
                      if (low.contains("youtube") || low.contains("यूट्यूब") || low.contains("gana") || low.contains("गाना") || low.contains("song")) {
                          val query = cleanCmd.replace(Regex("youtube|यूट्यूब|par|pe|khol|ke|खोल|chala|play|de|do|karo|gana|गाना|song"), "").trim()
                          speak("Theek hai Sir, kar raha hoon, YouTube khol raha hoon.")
                          handler.postDelayed({
                              val url = if (query.isNotEmpty()) "https://www.youtube.com/results?search_query=${Uri.encode(query)}" else "https://www.youtube.com"
                              val i = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                              startActivity(i)
                          }, 2500)
                          return true
                      }

                      val targetApp = cleanCmd.replace(Regex("app|application|ko|khol|kholo|khol de|खोल|खोलो|open|chala|chala de|चला|kar|de|do|karo"), "").trim()
                      if (targetApp.isNotEmpty() && launchInstalledAppByName(targetApp)) {
                          return true
                      }
                  }

                  return false
              }

              @SuppressLint("MissingPermission")
              private fun answerPhoneCall() {
                  try {
                      val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          tm.acceptRingingCall()
                          speak("Theek hai Sir, call utha liya hai.")
                      }
                  } catch (e: Exception) { speak("Sir, call uthane ke liye phone permission allow karein.") }
              }

              @SuppressLint("MissingPermission")
              private fun endPhoneCall() {
                  try {
                      val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          val cut = tm.endCall()
                          speak(if (cut) "Theek hai Sir, call kat diya hai." else "Sir, abhi koi active call nahi chal rahi hai.")
                      }
                  } catch (e: Exception) { speak("Sir, call katne ki permission check karein.") }
              }

              @SuppressLint("MissingPermission")
              private fun makeDirectCall(phone: String) {
                  speak("Theek hai Sir, kar raha hoon, $phone par call laga raha hoon.")
                  handler.postDelayed({
                      try {
                          val i = Intent(Intent.ACTION_CALL, Uri.parse("tel:$phone")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                          startActivity(i)
                      } catch (e: Exception) {
                          val dial = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$phone")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                          startActivity(dial)
                      }
                  }, 2400)
              }

              private fun downloadAppFromPlayStore(appName: String) {
                  speak("Theek hai Sir, kar raha hoon, Play Store par $appName khol raha hoon.")
                  handler.postDelayed({
                      try {
                          val marketIntent = Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=${Uri.encode(appName)}&c=apps")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                          startActivity(marketIntent)
                      } catch (e: Exception) {
                          val webIntent = Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/search?q=${Uri.encode(appName)}&c=apps")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                          startActivity(webIntent)
                      }
                  }, 2500)
              }

              private fun launchInstalledAppByName(spokenName: String): Boolean {
                  val pm = packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  val apps = pm.queryIntentActivities(mainIntent, 0)
                  val search = spokenName.lowercase(Locale.getDefault()).trim()

                  for (ri in apps) {
                      val label = ri.loadLabel(pm).toString().lowercase(Locale.getDefault())
                      val pkg = ri.activityInfo.packageName.lowercase(Locale.getDefault())
                      if (label.contains(search) || search.contains(label) || pkg.contains(search)) {
                          val niceName = ri.loadLabel(pm).toString()
                          speak("Theek hai Sir, kar raha hoon, $niceName khol raha hoon.")
                          handler.postDelayed({
                              val launch = pm.getLaunchIntentForPackage(ri.activityInfo.packageName)
                              if (launch != null) {
                                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(launch)
                              }
                          }, 2200)
                          return true
                      }
                  }

                  if (search.contains("camera") || search.contains("कैमरा")) {
                      speak("Theek hai Sir, kar raha hoon, camera khol raha hoon.")
                      handler.postDelayed({ startActivity(Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }, 2000)
                      return true
                  }
                  if (search.contains("setting") || search.contains("सेटिंग")) {
                      speak("Theek hai Sir, kar raha hoon, settings khol raha hoon.")
                      handler.postDelayed({ startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }, 2000)
                      return true
                  }
                  if (search.contains("alarm") || search.contains("अलार्म")) {
                      speak("Theek hai Sir, kar raha hoon, alarm khol raha hoon.")
                      handler.postDelayed({ startActivity(Intent(AlarmClock.ACTION_SHOW_ALARMS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }, 2000)
                      return true
                  }
                  return false
              }

              fun toggleTorch(state: Boolean) {
                  try {
                      val camManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val camId = camManager.cameraIdList[0]
                      camManager.setTorchMode(camId, state)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              fun bringJarvisToFront(spokenGreeting: String) {
                  handler.post {
                      val i = Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          putExtra("RETURN_AND_ASK", true)
                          putExtra("GREETING_MSG", spokenGreeting)
                      }
                      startActivity(i)
                  }
              }
                            override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val res = tts?.setLanguage(Locale("hi", "IN"))
                      if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) { tts?.setLanguage(Locale.US) }
                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) { isTtsSpeaking = true }
                          override fun onDone(utteranceId: String?) {
                              isTtsSpeaking = false
                              awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                              MainActivity.notifyTtsFinished()
                          }
                          override fun onError(utteranceId: String?) {
                              isTtsSpeaking = false
                              MainActivity.notifyTtsFinished()
                          }
                      })
                      speak("Jarvis Ultimate Hands-Free System on ho gaya hai Sir. Bas Jarvis boliye.")
                  }
              }

              fun speak(text: String) {
                  val cleanText = text.replace(Regex("[*#_`~]"), "")
                  isTtsSpeaking = true
                  awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                  tts?.speak(cleanText, TextToSpeech.QUEUE_FLUSH, null, "jarvis_utt_${System.currentTimeMillis()}")
              }

              fun stopSpeaking() {
                  isTtsSpeaking = false
                  tts?.stop()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  bgRecognizer?.destroy()
                  tts?.shutdown()
                  if (wakeLock?.isHeld == true) wakeLock?.release()
                  if (floatingView != null) windowManager?.removeView(floatingView)
              }
          }
