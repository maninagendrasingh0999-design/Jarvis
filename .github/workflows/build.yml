name: Jarvis 100% Hands-Free Super Agent APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java 17 & Gradle 8.7
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Build Web UI + Native Hands-Free Voice, Call & App Engine
        run: |
          mkdir -p extracted_web
          if [ -f "web-source.zip" ]; then
            unzip -o "web-source.zip" -d extracted_web/
          else
            for z in *.zip; do
              if [ -f "$z" ]; then
                unzip -o "$z" -d extracted_web/
              fi
            done
          fi

          mkdir -p app/src/main/java/com/myassistant/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          PKG_FILE=$(find extracted_web -maxdepth 4 -name "package.json" | head -n 1)

          if [ -n "$PKG_FILE" ]; then
            WEB_DIR=$(dirname "$PKG_FILE")
            pushd "$WEB_DIR"

            echo "GEMINI_API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI" > .env
            echo "VITE_GEMINI_API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI" >> .env
            echo "API_KEY=AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI" >> .env

            find . -maxdepth 3 -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i 's/process\.env\.GEMINI_API_KEY/"AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI"/g' {} + || true
            find . -maxdepth 3 -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" \) -exec sed -i 's/process\.env\.API_KEY/"AIzaSyDNKMF5hhri9fvpU7DSgHyFKB7rdkKaTI"/g' {} + || true

            npm install --legacy-peer-deps || npm install
            npx vite build --base=./ || npm run build || true
            popd

            if [ -d "$WEB_DIR/dist" ]; then
              cp -r "$WEB_DIR/dist/"* app/src/main/assets/
            elif [ -d "$WEB_DIR/build" ]; then
              cp -r "$WEB_DIR/build/"* app/src/main/assets/
            else
              cp -r "$WEB_DIR/"* app/src/main/assets/ 2>/dev/null || true
            fi
          else
            cp -r extracted_web/* app/src/main/assets/ 2>/dev/null || true
          fi

          if [ ! -f "app/src/main/assets/index.html" ]; then
            FOUND_HTML=$(find app/src/main/assets -name "index.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              PARENT_DIR=$(dirname "$FOUND_HTML")
              if [ "$PARENT_DIR" != "app/src/main/assets" ]; then
                cp -r "$PARENT_DIR/"* app/src/main/assets/
              fi
            fi
          fi

          # Gradle Setup
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.myassistant.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.myassistant.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 9
                  versionName "9.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # AndroidManifest with Telecom Call, Package Query & Background Microphone Permissions
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="J.A.R.V.I.S. AI"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:keepScreenOn="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingControlService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          # Always-On Background Native Voice Service (Works even inside YouTube, Instagram, Calls, or Home Screen!)
          cat << 'EOF' > app/src/main/java/com/myassistant/app/FloatingControlService.kt
          package com.myassistant.app

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.AlarmClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telecom.TelecomManager
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class FloatingControlService : Service(), TextToSpeech.OnInitListener {

              companion object {
                  var instance: FloatingControlService? = null
                  var isAppInForeground: Boolean = true
                  var awakeUntilTimestamp: Long = 0L
              }

              private var windowManager: WindowManager? = null
              private var floatingView: View? = null
              private var statusBadge: TextView? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var tts: TextToSpeech? = null
              private var bgRecognizer: SpeechRecognizer? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isTtsSpeaking = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  tts = TextToSpeech(this, this)
                  acquireWakeLock()
                  startForegroundNotification()
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {
                      showFloatingButton()
                  }
                  // Start 1-minute active window on launch
                  awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                  startBackgroundVoiceLoop()
              }

              private fun acquireWakeLock() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Jarvis::HandsFreeWakeLock")
                      wakeLock?.acquire()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "jarvis_handsfree_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "JARVIS Hands-Free Guard", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(channel)
                  }
                  val returnIntent = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, returnIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("J.A.R.V.I.S. 100% Hands-Free Active")
                      .setContentText("Just say 'Jarvis' anytime from any screen")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
                  startForeground(101, notification)
              }

              private fun showFloatingButton() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val density = resources.displayMetrics.density
                  val width = (105 * density).toInt()
                  val height = (42 * density).toInt()

                  val container = FrameLayout(this)
                  val bg = GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = 50f
                      setColor(Color.parseColor("#EE03152D"))
                      setStroke(4, Color.parseColor("#00F3FF"))
                  }
                  container.background = bg

                  statusBadge = TextView(this).apply {
                      text = "🟢 JARVIS ON"
                      setTextColor(Color.parseColor("#00F3FF"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                  }
                  container.addView(statusBadge, FrameLayout.LayoutParams(width, height))

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      width, height, layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 14
                      y = 260
                  }

                  var initX = 0
                  var initY = 0
                  var touchX = 0f
                  var touchY = 0f

                  container.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initX = params.x
                              initY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initX - (event.rawX - touchX).toInt()
                              params.y = initY + (event.rawY - touchY).toInt()
                              windowManager?.updateViewLayout(container, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (Math.abs(event.rawX - touchX) < 15 && Math.abs(event.rawY - touchY) < 15) {
                                  awakeUntilTimestamp = System.currentTimeMillis() + 60000L
                                  updateBadgeVisual(true)
                                  bringJarvisToFront("Ji boliye Sir, main sun raha hoon.")
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  floatingView = container
                  windowManager?.addView(floatingView, params)
              }

              private fun updateBadgeVisual(awake: Boolean) {
                  handler.post {
                      statusBadge?.text = if (awake) "🟢 JARVIS ON" else "💤 SAY JARVIS"
                      statusBadge?.setTextColor(if (awake) Color.parseColor("#00FFAA") else Color.parseColor("#00F3FF"))
                  }
              }

              // Background SpeechRecognizer so user NEVER needs to tap even when inside YouTube or another app!
              private fun startBackgroundVoiceLoop() {
                  handler.post {
                      try {
                          if (bgRecognizer == null && SpeechRecognizer.isRecognitionAvailable(this)) {
                              bgRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                              bgRecognizer?.setRecognitionListener(object : RecognitionListener {
                                  override fun onReadyForSpeech(params: Bundle?) {}
                                  override fun onBeginningOfSpeech() {}
                                  override fun onRmsChanged(rmsdB: Float) {}
                                  override fun onBufferReceived(buffer: ByteArray?) {}
                                  override fun onEndOfSpeech() {}
                                  override fun onError(error: Int) {
                                      scheduleRestartListening(700)
                                  }
                                  override fun onResults(results: Bundle?) {
                                      val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                      if (!matches.isNullOrEmpty()) {
                                          handleSpokenCommand(matches[0])
                                      }
                                      scheduleRestartListening(400)
                                  }
                                  override fun onPartialResults(partialResults: Bundle?) {}
                                  override fun onEvent(eventType: Int, params: Bundle?) {}
                              })
                          }
                          scheduleRestartListening(500)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun scheduleRestartListening(delayMs: Long) {
                  handler.postDelayed({
                      val isAwake = System.currentTimeMillis() < awakeUntilTimestamp
                      updateBadgeVisual(isAwake)
                      // Only use background recognizer when MainActivity WebView is in background (so they don't clash)
                      if (!isAppInForeground && !isTtsSpeaking) {
                          try {
                              val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                                  putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                              }
                              bgRecognizer?.startListening(intent)
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      } else {
                          scheduleRestartListenin
