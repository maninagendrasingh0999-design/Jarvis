          EOF
                    cat << 'EOF' > app/src/main/java/com/myassistant/app/JarvisNotificationListener.kt
          package com.myassistant.app

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.app.Notification

          class JarvisNotificationListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn == null) return
                  val pkg = sbn.packageName ?: ""
                  if (pkg.contains("whatsapp") || pkg.contains("sms") || pkg.contains("mms") || pkg.contains("messaging") || pkg.contains("telegram") || pkg.contains("instagram")) {
                      val extras = sbn.notification.extras
                      val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: "Kisi"
                      val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      if (text.isNotEmpty() && !title.contains("WhatsApp", ignoreCase = true)) {
                          val msg = "Sir, $title ka message aaya hai: $text."
                          FloatingControlService.instance?.speak(msg)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/myassistant/app/FloatingControlService.kt
          package com.myassistant.app

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.hardware.camera2.CameraManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telecom.TelecomManager
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.concurrent.thread

          class FloatingControlService : Service(), TextToSpeech.OnInitListener {
              companion object {
                  var instance: FloatingControlService? = null
                  var awakeUntilTimestamp: Long = 0L
              }
              private var windowManager: WindowManager? = null
              private var floatingView: View? = null
              private var statusBadge: TextView? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var tts: TextToSpeech? = null
              private var mediaPlayer: MediaPlayer? = null
              private var bgRecognizer: SpeechRecognizer? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isTtsSpeaking = false
              private var isListeningNow = false
              private var lastPartialText = ""
              private var lastCommandTime = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  return START_STICKY
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  tts = TextToSpeech(this, this)
                  acquireWakeLock()
                  startForegroundNotification()
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {
                      showFloatingButton()
                  }
                  awakeUntilTimestamp = System.currentTimeMillis() + 3600000L
                  startBackgroundVoiceLoop()
              }

              private fun acquireWakeLock() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Jarvis::HandsFreeWakeLock")
                      wakeLock?.acquire()
                  } catch (e: Exception) { e.printStackTrace() }
              }
                            private fun startForegroundNotification() {
                  val channelId = "jarvis_handsfree_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "JARVIS Hands-Free Guard", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(channel)
                  }
                  val returnIntent = Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  }
                  val pendingIntent = PendingIntent.getActivity(this, 0, returnIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("J.A.R.V.I.S. 24/7 Background Active")
                      .setContentText("Listening smoothly in background & all apps...")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
                  startForeground(101, notification)
              }

              private fun showFloatingButton() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val density = resources.displayMetrics.density
                  val width = (118 * density).toInt()
                  val height = (44 * density).toInt()

                  val container = FrameLayout(this)
                  val bg = GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = 50f
                      setColor(Color.parseColor("#EE03152D"))
                      setStroke(4, Color.parseColor("#00F3FF"))
                  }
                  container.background = bg

                  statusBadge = TextView(this).apply {
                      text = "🟢 JARVIS LIVE"
                      setTextColor(Color.parseColor("#00FFAA"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                  }
                  container.addView(statusBadge, FrameLayout.LayoutParams(width, height))

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      width, height, layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 14
                      y = 260
                  }

                  var initX = 0
                  var initY = 0
                  var touchX = 0f
                  var touchY = 0f

                  container.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initX = params.x
                              initY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initX - (event.rawX - touchX).toInt()
                              params.y = initY + (event.rawY - touchY).toInt()
                              windowManager?.updateViewLayout(container, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (Math.abs(event.rawX - touchX) < 15 && Math.abs(event.rawY - touchY) < 15) {
                                  awakeUntilTimestamp = System.currentTimeMillis() + 3600000L
                                  updateBadgeVisual(true)
                                  speak("Haan Sir, boliye main sun raha hoon.")
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  floatingView = container
                  windowManager?.addView(floatingView, params)
              }

              private fun updateBadgeVisual(awake: Boolean) {
                  handler.post {
                      statusBadge?.text = if (awake) "🟢 JARVIS LIVE" else "💤 SAY JARVIS"
                      statusBadge?.setTextColor(if (awake) Color.parseColor("#00FFAA") else Color.parseColor("#00F3FF"))
                  }
              }

              private fun initOrResetRecognizer() {
                  try {
                      bgRecognizer?.destroy()
                  } catch (e: Exception) {}
                  bgRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  bgRecognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {
                          isListeningNow = true
                          lastPartialText = ""
                      }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {
                          isListeningNow = false
                      }
                      override fun onError(error: Int) {
                          isListeningNow = false
                          if (lastPartialText.length > 3 && !isTtsSpeaking) {
                              val fallbackCmd = lastPartialText
                              lastPartialText = ""
                              handleSpokenCommand(fallbackCmd)
                          }
                          if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY || error == SpeechRecognizer.ERROR_CLIENT) {
                              handler.postDelayed({
                                  initOrResetRecognizer()
                                  scheduleRestartListening(300)
                              }, 400)
                          } else {
                              scheduleRestartListening(350)
                          }
                      }
                      override fun onResults(results: Bundle?) {
                          isListeningNow = false
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          val finalSpoken = if (!matches.isNullOrEmpty()) matches[0] else lastPartialText
                          lastPartialText = ""
                          if (finalSpoken.isNotEmpty() && !isTtsSpeaking) {
                              handleSpokenCommand(finalSpoken)
                          }
                          scheduleRestartListening(250)
                      }
                      override fun onPartialResults(partialResults: Bundle?) {
                          val pList = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!pList.isNullOrEmpty() && pList[0].isNotEmpty()) {
                              lastPartialText = pList[0]
                          }
                      }
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              private fun startBackgroundVoiceLoop() {
                  handler.post {
                      if (SpeechRecognizer.isRecognitionAvailable(this)) {
                          initOrResetRecognizer()
                          scheduleRestartListening(400)
                      }
                  }
              }
                            private fun scheduleRestartListening(delayMs: Long) {
                  handler.removeCallbacksAndMessages("RECOG_RESTART")
                  handler.postAtTime({
                      val isAwake = System.currentTimeMillis() < awakeUntilTimestamp
                      updateBadgeVisual(isAwake)
                      if (!isTtsSpeaking && !isListeningNow) {
                          try {
                              val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                                  putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                                  putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                                  putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 4000L)
                                  putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 3000L)
                              }
                              bgRecognizer?.startListening(intent)
                          } catch (e: Exception) {
                              initOrResetRecognizer()
                          }
                      } else if (isTtsSpeaking) {
                          scheduleRestartListening(800)
                      }
                  }, "RECOG_RESTART", android.os.SystemClock.uptimeMillis() + delayMs)
              }

              fun handleSpokenCommand(rawText: String): Boolean {
                  if (isTtsSpeaking) return false
                  val now = System.currentTimeMillis()
                  if (now - lastCommandTime < 1800L) return true

                  val cmd = rawText.trim()
                  val low = cmd.lowercase(Locale.getDefault())

                  // Echo guard
                  if (low.contains("laga raha hoon") || low.contains("khol raha hoon") || low.contains("kar diya hai") || low.contains("bataiye aage kya") || low.contains("sun raha hoon")) return false

                  lastCommandTime = now
                  awakeUntilTimestamp = System.currentTimeMillis() + 3600000L
                  updateBadgeVisual(true)

                  val cleanCmd = low.replace(Regex("hey|hi|hello|सुनो|अरे|भाई|यार|सर|sir|jarvis|जार्विस|जर्विस|जरविस|javis|please|zara|जरा"), "").trim()
                  if (cleanCmd.isEmpty() || cleanCmd == "हां" || cleanCmd == "जी") {
                      speak("Ji Sir, boliye main sun raha hoon!")
                      return true
                  }

                  // 1. Clean YouTube & Song Command (Fixes "युटुब यूट्यूब खोलो" issue!)
                  if (low.contains("youtube") || low.contains("यूट्यूब") || low.contains("युटुब") || low.contains("यू ट्यूब") || low.contains("gana") || low.contains("गाना") || low.contains("song")) {
                      val songQuery = cleanCmd
                          .replace(Regex("youtube|यूट्यूब|युटुब|यू ट्यूब|यूटुब|kholo|khol|खोलो|खोल|खोलकर|खोल के|khol ke|khol kar|ke|kar|के|कर|par|pe|पर|पे|mein|में|gana|गाना|गाने|song|video|वीडियो|chalu|चालू|chala|चला|चलाओ|chalao|laga|लगा|लगाओ|lagao|play|karo|do|de|दें|दो|दे|करो|मुझे|सुनाओ|sunao|yaar|bhai|zara|जरा"), " ")
                          .replace(Regex("\\s+"), " ")
                          .trim()

                      if (songQuery.length >= 2) {
                          speak("Ok Sir, main YouTube khol kar $songQuery gana laga raha hoon.")
                          handler.postDelayed({
                              try {
                                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=${Uri.encode(songQuery)}")).apply {
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  }
                                  startActivity(i)
                                  handler.postDelayed({
                                      speak("Sir, maine YouTube par $songQuery laga diya hai. Ab bataiye aage kya karna hai?")
                                  }, 4200)
                              } catch (e: Exception) {}
                          }, 2800)
                      } else {
                          speak("Ok Sir, main abhi YouTube khol raha hoon.")
                          handler.postDelayed({
                              try {
                                  val launch = packageManager.getLaunchIntentForPackage("com.google.android.youtube")
                                      ?: Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com"))
                                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(launch)
                                  handler.postDelayed({
                                      speak("Sir, maine YouTube khol diya hai. Ab bataiye kaunsa gana ya video chalana hai?")
                                  }, 3500)
                              } catch (e: Exception) {}
                          }, 2200)
                      }
                      return true
                  }

                  // 2. Torch / Flashlight (Pre + Post Human Confirmation)
                  if (low.contains("torch") || low.contains("flashlight") || low.contains("light") || low.contains("टॉर्च") || low.contains("लाइट")) {
                      val turnOn = !(low.contains("off") || low.contains("band") || low.contains("बंद") || low.contains("bujha"))
                      speak(if (turnOn) "Ok Sir, main phone ki flashlight on kar raha hoon." else "Ok Sir, main flashlight band kar raha hoon.")
                      handler.postDelayed({
                          toggleTorch(turnOn)
                          speak(if (turnOn) "Sir, maine flashlight on kar di hai." else "Sir, maine flashlight band kar di hai.")
                      }, 2200)
                      return true
                  }

                  // 3. Call Cut / Wapas Jarvis Screen Par Aana
                  if (low.contains("band kar") || low.contains("बंद कर") || low.contains("kat de") || low.contains("काट दे") || low.contains("wapas") || low.contains("वापस") || low.contains("home") || low.contains("होम")) {
                      if (low.contains("call") || low.contains("phone") || low.contains("कॉल") || low.contains("फोन")) {
                          speak("Ok Sir, main call kaat raha hoon.")
                          handler.postDelayed({ endPhoneCall() }, 1800)
                          return true
                      }
                      speak("Ok Sir, main wapas Jarvis screen par aa raha hoon.")
                      handler.postDelayed({
                          bringJarvisToFront("Sir, main wapas Jarvis screen par aa gaya hoon. Boliye ab kya karna hai?")
                      }, 2200)
                      return true
                  }

                  // 4. Kisi Bhi Installed App Ko Kholna (Pre + Post Confirmation)
                  if (low.contains("khol") || low.contains("खोल") || low.contains("open") || low.contains("chala") || low.contains("चला") || low.contains("chalu") || low.contains("चालू")) {
                      val targetApp = cleanCmd.replace(Regex("app|application|ko|khol|kholo|khol de|खोल|खोलो|open|chala|chala de|चला|चलाओ|chalu|चालू|kar|de|do|karo|करो|दो|दे"), "").trim()
                      if (targetApp.isNotEmpty() && launchInstalledAppByName(targetApp)) {
                          return true
                      }
                  }

                  // 5. Long Conversational Commands -> Direct Fast Gemini AI Reply
                  if (cleanCmd.length >= 2) {
                      askGeminiDirectly(cleanCmd)
                      return true
                  }

                  return false
              }

              private fun askGeminiDirectly(userQuestion: String) {
                  thread {
                      try {
                          val apiKey = BuildConfig.GEMINI_API_KEY
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$apiKey")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json")
                              doOutput = true
                              connectTimeout = 8000
                              readTimeout = 8000
                          }
                          val prompt = "Tum Jarvis ho, ek bahut hi smart aur insaan jaisa dostana AI assistant. Sir ne kaha hai: '$userQuestion'. Iska chota, natural aur insaan jaisa Hindi (Devanagari) mein jawab do (1 se 2 line mein)."
                          val payload = JSONObject().apply {
                              put("contents", JSONArray().put(JSONObject().apply {
                                  put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                              }))
                          }
                          conn.outputStream.use { it.write(payload.toString().toByteArray()) }
                          if (conn.responseCode == 200) {
                              val resp = conn.inputStream.bufferedReader().readText()
                              val json = JSONObject(resp)
                              val reply = json.getJSONArray("candidates")
                                  .getJSONObject(0)
                                  .getJSONObject("content")
                                  .getJSONArray("parts")
                                  .getJSONObject(0)
                                  .getString("text")
                                  .replace("*", "")
                                  .trim()
                              speak(reply)
                          } else {
                              speak("Ji Sir, main sun raha hoon, boliye.")
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun endPhoneCall() {
                  try {
                      val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          val cut = tm.endCall()
                          speak(if (cut) "Sir, maine call kaat diya hai." else "Sir, abhi koi call nahi chal rahi hai.")
                      }
                  } catch (e: Exception) { speak("Sir, call permission on nahi hai.") }
              }

              private fun launchInstalledAppByName(spokenName: String): Boolean {
                  val pm = packageManager
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  val apps = pm.queryIntentActivities(mainIntent, 0)
                  val search = spokenName.lowercase(Locale.getDefault()).trim()

                  for (ri in apps) {
                      val label = ri.loadLabel(pm).toString().lowercase(Locale.getDefault())
                      val pkg = ri.activityInfo.packageName.lowercase(Locale.getDefault())
                      if (label.contains(search) || search.contains(label) || pkg.contains(search)) {
                          val niceName = ri.loadLabel(pm).toString()
                          speak("Ok Sir, main $niceName khol raha hoon.")
                          handler.postDelayed({
                              val launch = pm.getLaunchIntentForPackage(ri.activityInfo.packageName)
                              if (launch != null) {
                                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(launch)
                                  handler.postDelayed({
                                      speak("Sir, maine $niceName khol diya hai. Ab bataiye aage kya karna hai?")
                                  }, 3200)
                              }
                          }, 2200)
                          return true
                      }
                  }
                  return false
              }

              fun toggleTorch(state: Boolean) {
                  try {
                      val camManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val camId = camManager.cameraIdList[0]
                      camManager.setTorchMode(camId, state)
                  } catch (e: Exception) { e.printStackTrace() }
              }

              fun bringJarvisToFront(spokenGreeting: String) {
                  handler.post {
                      val i = Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      }
                      startActivity(i)
                      if (spokenGreeting.isNotEmpty()) {
                          handler.postDelayed({ speak(spokenGreeting) }, 1200)
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      val res = tts?.setLanguage(Locale("hi", "IN"))
                      if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) { tts?.setLanguage(Locale.US) }
                      tts?.setSpeechRate(1.02f)
                      tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) { 
                              isTtsSpeaking = true 
                              try { bgRecognizer?.cancel() } catch(e: Exception) {}
                          }
                          override fun onDone(utteranceId: String?) {
                              isTtsSpeaking = false
                              awakeUntilTimestamp = System.currentTimeMillis() + 3600000L
                              MainActivity.notifyTtsFinished()
                              scheduleRestartListening(200)
                          }
                          override fun onError(utteranceId: String?) {
                              isTtsSpeaking = false
                              MainActivity.notifyTtsFinished()
                              scheduleRestartListening(200)
                          }
                      })
                      speak("नमस्ते सर, जार्विस अब एलेवेन लैब्स वॉइस और बैकग्राउंड मोड के साथ पूरी तरह तैयार है।")
                  }
              }

              fun speak(text: String) {
                  isTtsSpeaking = true
                  handler.post {
                      try { bgRecognizer?.cancel() } catch(e: Exception) {}
                      awakeUntilTimestamp = System.currentTimeMillis() + 3600000L
                  }
                  thread {
                      var playedEleven = false
                      try {
                          val eleKey = BuildConfig.ELEVENLABS_API_KEY
                          val voiceId = "21m00Tcm4TlvDq8ikWAM" // Rachel Multilingual v2
                          val url = URL("https://api.elevenlabs.io/v1/text-to-speech/$voiceId")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("xi-api-key", eleKey)
                              setRequestProperty("Content-Type", "application/json")
                              setRequestProperty("Accept", "audio/mpeg")
                              doOutput = true
                              connectTimeout = 5000
                              readTimeout = 7000
                          }
                          val body = JSONObject().apply {
                              put("text", text)
                              put("model_id", "eleven_multilingual_v2")
                          }
                          conn.outputStream.use { it.write(body.toString().toByteArray()) }
                          if (conn.responseCode == 200) {
                              val audioBytes = conn.inputStream.readBytes()
                              if (audioBytes.size > 500) {
                                  val tempFile = File(cacheDir, "jarvis_eleven.mp3")
                                  FileOutputStream(tempFile).use { it.write(audioBytes) }
                                  playedEleven = true
                                  handler.post {
                                      try {
                                          mediaPlayer?.release()
                                          mediaPlayer = MediaPlayer().apply {
                                              setDataSource(tempFile.absolutePath)
                                              setOnCompletionListener {
                                                  isTtsSpeaking = false
                                                  MainActivity.notifyTtsFinished()
                                                  scheduleRestartListening(200)
                                              }
                                              setOnErrorListener { _, _, _ ->
                                                  isTtsSpeaking = false
                                                  scheduleRestartListening(200)
                                                  true
                                              }
                                              prepare()
                                              start()
                                          }
                                      } catch (e: Exception) {
                                          fallbackDeviceTts(text)
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) { e.printStackTrace() }

                      if (!playedEleven) {
                          handler.post { fallbackDeviceTts(text) }
                      }
                  }
              }

              private fun fallbackDeviceTts(text: String) {
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis_utt_${System.currentTimeMillis()}")
              }

              fun stopSpeaking() {
                  isTtsSpeaking = false
                  try { mediaPlayer?.stop() } catch (e: Exception) {}
                  tts?.stop()
                  scheduleRestartListening(250)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
                  bgRecognizer?.destroy()
                  mediaPlayer?.release()
                  tts?.shutdown()
                  if (wakeLock?.isHeld == true) wakeLock?.release()
                  if (floatingView != null) windowManager?.removeView(floatingView)
              }
          }
